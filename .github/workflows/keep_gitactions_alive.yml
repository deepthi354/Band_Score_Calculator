name: Keep Git Actions Alive

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month
  workflow_dispatch:       # Manual trigger anytime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Fixes the Node.js warning

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Fixes the 403 permission error

      - name: Make an empty commit to register repo activity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: keep workflows alive [$(date -u '+%Y-%m-%d')]"
          git push
